<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Uny — hors ligne</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
        padding: 24px; background: #f6f5fb; color: #15122e; text-align: center;
        font-family: -apple-system, "Segoe UI", Roboto, system-ui, sans-serif;
      }
      .box { max-width: 340px; }
      h1 { font-size: 22px; margin: 20px 0 8px; }
      p { color: #6b6889; line-height: 1.5; margin: 0 0 24px; }
      .card {
        display: none; margin: 0 0 20px; padding: 18px; border-radius: 22px; text-align: left;
        background: linear-gradient(135deg, #3b1fd1, #5733f0); color: #fff;
      }
      .card .row { display: flex; gap: 14px; align-items: center; }
      .card .qr { background: #fff; border-radius: 12px; padding: 6px; width: 104px; height: 104px; flex-shrink: 0; }
      .card .qr svg { width: 100%; height: 100%; }
      .card h2 { font-size: 18px; margin: 0; }
      .card small { display: block; opacity: .85; font-size: 12px; margin-top: 2px; }
      .card code { font-size: 13px; letter-spacing: .5px; }
      .when { font-size: 13px; color: #15122e; background: #fff3dc; border-radius: 14px; padding: 10px 12px; margin: 0 0 16px; display: none; }
      button {
        width: 100%; height: 48px; border: 0; border-radius: 16px; background: #5733f0; color: #fff;
        font-size: 16px; font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <svg width="72" height="72" viewBox="0 0 48 48" aria-hidden="true">
        <rect width="48" height="48" rx="14" fill="#5733f0" />
        <path d="M14 14v11a10 10 0 0 0 20 0V14" fill="none" stroke="#fff" stroke-width="5.5" stroke-linecap="round" />
        <circle cx="36.5" cy="36.5" r="4.5" fill="#ffb23f" />
      </svg>
      <div class="card" id="card" aria-label="Ma carte Uny enregistrée">
        <div class="row">
          <div class="qr" id="qr"></div>
          <div>
            <h2 id="name"></h2>
            <small id="uni"></small>
            <small><code id="unyid"></code></small>
            <small id="status"></small>
          </div>
        </div>
      </div>
      <p class="when" id="when" role="status"></p>
      <h1>Pas de connexion</h1>
      <p>Uny a besoin d'internet pour charger tes avantages, jobs et logements. Vérifie ta connexion puis réessaie.</p>
      <button type="button" id="retry">Réessayer</button>
    </div>
    <script>
      // Carte enregistrée par l'application lors de la dernière ouverture de « Ma carte » (connectée).
      // Elle sert à se présenter ; le partenaire vérifie toujours la carte en ligne avant une réduction.
      (function () {
        var prefs = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Preferences;
        if (!prefs) return;
        prefs.get({ key: "uny.offlineCard" }).then(function (r) {
          if (!r || !r.value) return;
          var c = JSON.parse(r.value);
          var labels = { verified: "Étudiant vérifié", pending: "Vérification en cours", unverified: "Non vérifié", expired: "Carte expirée", revoked: "Carte révoquée" };
          document.getElementById("name").textContent = c.firstName + " " + c.lastName;
          document.getElementById("uni").textContent = c.university || "";
          document.getElementById("unyid").textContent = c.unyId;
          document.getElementById("status").textContent = (labels[c.status] || c.status) + " · " + c.academicYear;
          if (c.qrSvg && /^<svg[\s>]/.test(c.qrSvg) && !/<script|on\w+=/i.test(c.qrSvg)) document.getElementById("qr").innerHTML = c.qrSvg;
          var when = new Date(c.savedAt).toLocaleString("fr-FR", { day: "numeric", month: "long", hour: "2-digit", minute: "2-digit" });
          var w = document.getElementById("when");
          w.textContent = "Carte enregistrée sur ce téléphone, actualisée le " + when + ". Le partenaire la vérifie en ligne avant d'appliquer une réduction.";
          w.style.display = "block";
          document.getElementById("card").style.display = "block";
          document.querySelector("h1").textContent = "Hors connexion";
        }).catch(function () {});
      })();
      document.getElementById("retry").addEventListener("click", function () {
        fetch("app-url.json")
          .then(function (r) { return r.json(); })
          .then(function (c) { window.location.href = c.url + "/accueil"; })
          .catch(function () { window.location.reload(); });
      });
    </script>
  </body>
</html>
