name: Applications mobiles

# Chaîne officielle de publication (voir docs/PUBLICATION-STORES.md) :
#   Google Play → android/ (Trusted Web Activity)      App Store → mobile/ios (Capacitor)
# Sans secrets : builds de vérification. Avec les secrets : AAB signé, envoi iOS vers TestFlight.

on:
  push:
    paths: ["mobile/**", "android/**", ".github/workflows/mobile.yml"]
  workflow_dispatch:

defaults:
  run:
    working-directory: mobile

jobs:
  # Google Play : application android/ (Trusted Web Activity, paquet com.unyafrica.app).
  # mobile/android (Capacitor) n'est PAS publiée : même identifiant, une seule application possible sur Google Play.
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    env:
      HAS_KEYSTORE: ${{ secrets.TWA_UPLOAD_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: echo "sdk.dir=$ANDROID_HOME" > local.properties
      - name: Build (AAB Google Play + APK de test)
        run: ./gradlew --no-daemon bundleRelease assembleRelease
      - name: Signature avec la clé de téléversement (si les secrets sont présents)
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        env:
          KEYSTORE: ${{ secrets.TWA_UPLOAD_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.TWA_UPLOAD_KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/upload.keystore"
          jarsigner -keystore "$RUNNER_TEMP/upload.keystore" -storepass "$PASSWORD" -keypass "$PASSWORD" \
            -sigalg SHA256withRSA -digestalg SHA-256 app/build/outputs/bundle/release/app-release.aab uny
          rm "$RUNNER_TEMP/upload.keystore"
      - uses: actions/upload-artifact@v4
        with:
          name: uny-android-google-play
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/apk/release/app-release-unsigned.apk

  ios:
    runs-on: macos-latest
    env:
      HAS_APPLE_KEY: ${{ secrets.APPSTORE_API_KEY_P8 != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npx cap sync ios

      - name: Build de vérification (simulateur, sans signature)
        if: ${{ env.HAS_APPLE_KEY != 'true' }}
        working-directory: mobile/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -20

      - name: Archive signée + envoi TestFlight
        if: ${{ env.HAS_APPLE_KEY == 'true' }}
        working-directory: mobile/ios/App
        env:
          KEY_P8: ${{ secrets.APPSTORE_API_KEY_P8 }}
          KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey_$KEY_ID.p8"
          echo "$KEY_P8" > "$KEY_PATH"
          AUTH="-allowProvisioningUpdates -authenticationKeyPath $KEY_PATH -authenticationKeyID $KEY_ID -authenticationKeyIssuerID $ISSUER_ID"
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Uny.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            $AUTH archive | tail -20
          cat > "$RUNNER_TEMP/export.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Uny.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/export" $AUTH
